[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-roughness-signal-prediction"
version = "0.1.0"
description = "Predict machining surface roughness from acoustic or vibration signal features."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.scripts]
roughness-demo = "roughness_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
